{{define "discovery_unavailable"}}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{.CSRF}}">
<title>WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<script src="/assets/js/theme.js"></script>
</head>
<body class="wcp-body">
{{template "wcp_open" .}}
  <p><a href="{{.Back}}">← {{.BackLabel}}</a></p>
  <div class="alert alert-warning" role="alert">
    <div class="d-flex gap-2">
      <i class="bi bi-plug fs-5" aria-hidden="true"></i>
      <div class="fw-semibold">{{.Error}}</div>
    </div>
  </div>
  <div class="card wcp-empty">
    <div class="card-body text-center py-5">
      <i class="bi bi-plug display-6 text-body-secondary"></i>
      <p class="mt-3 mb-0 text-body-secondary">This page needs the WhaCP agent. It will show data as soon as the agent is reachable.</p>
    </div>
  </div>
{{template "wcp_close" .}}
</body>
</html>{{end}}
