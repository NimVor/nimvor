{{define "db_browser"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{.CSRF}}">
<title>Database {{.Database}} · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <p><a href="{{.Back}}">&larr; Databases</a></p>
  <h1>Database <code>{{.Database}}</code></h1>
  <span class="small text-muted d-none d-md-inline" data-db-server></span>
  <!-- The DOM and data attributes drive the reused /assets/js/dbbrowser.js;
       every operation runs in the agent as the database's own browser
       account. -->
  <div class="wcp-db" id="wcp-db" data-api="{{.API}}" data-database="{{.Database}}">
    <aside class="wcp-db-side">
      <div class="db-side-bar">
        <input type="search" placeholder="Filter tables" aria-label="Filter tables" data-db-table-filter>
        <button type="button" data-db-new-table title="Create a table">+ New table</button>
      </div>
      <ul data-db-tables aria-label="Tables"></ul>
      <div class="small text-muted" data-db-tables-count></div>
    </aside>
    <section class="wcp-db-main">
      <nav class="wcp-db-tabs" role="tablist">
        <button type="button" role="tab" data-db-tab="browse" disabled>Browse</button>
        <button type="button" role="tab" data-db-tab="structure" disabled>Structure</button>
        <button type="button" role="tab" data-db-tab="insert" disabled>Insert</button>
        <button type="button" role="tab" data-db-tab="sql">SQL</button>
        <span class="ms-auto small text-muted" data-db-current></span>
      </nav>
      <div class="wcp-db-pane" data-db-pane aria-live="polite">
        <span class="text-muted">Choose a table on the left, or open the SQL tab.</span>
      </div>
    </section>
  </div>
  <!-- The JS dialogs (dbbrowser.js fills them in; the bootstrap modal UI
       rides with the Go shell work, the flow itself is plain HTML). -->
  <div id="db-dialog">
    <form data-db-dialog-form novalidate>
      <h2 class="modal-title"></h2>
      <div data-db-dialog-body></div>
      <button type="button" class="dialog-cancel">Cancel</button>
      <button type="submit" data-db-dialog-ok>OK</button>
    </form>
  </div>
  <div id="db-form">
    <form data-db-form novalidate>
      <h2 class="modal-title"></h2>
      <div data-db-form-body></div>
      <pre class="wcp-db-create" data-db-form-sql></pre>
      <button type="button" data-db-form-preview>Show SQL</button>
      <button type="button" class="form-cancel">Cancel</button>
      <button type="submit" data-db-form-ok>Save</button>
    </form>
  </div>
  <script src="/assets/js/whacp.js"></script>
  <script src="/assets/js/dbbrowser.js" defer></script>
</main>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}
