{{define "ssl_services"}}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSL services · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<script src="/assets/js/theme.js"></script>
</head>
<body class="wcp-body">
{{template "wcp_open" .}}
  <h1>SSL services</h1>
  {{if .Success}}<p class="alert alert-success">{{.Success}}</p>{{end}}
  {{if .Error}}<p class="alert alert-danger">{{.Error}}</p>{{end}}
  {{if .AgentError}}<p class="alert alert-warning">Agent error: {{.AgentError}}</p>{{end}}
  <pre class="font-monospace small">{{.}}</pre>
{{template "wcp_close" .}}
</body>
</html>{{end}}
