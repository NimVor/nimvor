{{define "roles"}}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<script src="/assets/js/theme.js"></script>
</head>
<body class="wcp-body">
{{template "wcp_open" .}}
  <h1>Roles</h1>
  <table class="data-table">
    <thead><tr><th>Role</th><th>Scope</th><th>2FA</th><th>Users</th><th>Type</th></tr></thead>
    <tbody>
    {{range .Roles}}
      <tr>
        <td>{{.Label}}</td>
        <td>{{.Scope}}</td>
        <td>{{if .RequireTwoFactor}}required{{else}}—{{end}}</td>
        <td>{{.UserCount}}</td>
        <td>{{if .IsSystem}}built-in{{else}}custom{{end}}</td>
      </tr>
    {{end}}
    </tbody>
  </table>
{{template "wcp_close" .}}
</body>
</html>{{end}}
