name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: test -z "$(gofmt -l agent)" || (gofmt -l agent; exit 1)
      - name: vet
        run: cd agent && go vet ./...
      - name: test
        run: cd agent && go test -race ./...
      - name: build
        run: make build

  panel:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
      - run: cd panel && composer install --no-interaction --no-progress
      - run: make lint
      - run: cd panel && vendor/bin/phpunit

  # Agent tests against real services on a disposable runner: nginx,
  # PHP-FPM, MariaDB, Redis, UFW, SSH, Fail2ban, WordPress and Laravel
  # (downloaded from wordpress.org / Packagist as in production).
  realhost:
    runs-on: ubuntu-24.04
    needs: [agent]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install services
        run: |
          sudo systemctl stop mysql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -q 'mysql-server*' 'mysql-client*' 'mysql-common' || true
          sudo rm -rf /var/lib/mysql /etc/mysql
          sudo apt-get update -q
          echo "postfix postfix/main_mailer_type select Internet Site" | sudo debconf-set-selections
          echo "postfix postfix/mailname string ci.whacp.test" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            nginx mariadb-server mariadb-client redis-server memcached pure-ftpd bind9 bind9utils postfix dovecot-imapd dovecot-lmtpd dovecot-sieve opendkim rspamd ufw fail2ban openssh-server git \
            php8.3-cli php8.3-fpm php8.3-mysql php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip
          command -v composer || { curl -fsSL https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer; }
          sudo systemctl start mariadb redis-server memcached nginx php8.3-fpm ssh named
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo systemctl restart fail2ban
          sudo nginx -t
          sudo mysql -e 'select version()'
      - name: Real-host tests (as root)
        run: |
          cd agent
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "HOME=$HOME" WHACP_NETWORK=1 \
            go test -tags realhost -run RealHost -count=1 -p 1 -v ./... 2>&1 | tee realhost.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q -- '--- SKIP' realhost.log || { grep -- '--- SKIP' -A1 realhost.log; exit 1; }

  # Browser tests (Playwright/Chromium) against a write-mode dev instance.
  e2e:
    runs-on: ubuntu-24.04
    needs: [agent, panel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring, sodium
      - run: cd panel && composer install --no-interaction --no-progress
      - name: Install Playwright and Redis
        run: |
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends redis-server
          cd tests/e2e
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: NODE_PATH=$PWD/tests/e2e/node_modules E2E_OUT=$RUNNER_TEMP/e2e tests/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e

  smoke:
    runs-on: ubuntu-24.04
    needs: [agent, panel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
      - run: cd panel && composer install --no-interaction --no-progress
      - run: tests/integration/smoke.sh
      - run: tests/integration/upgrade.sh
