{{define "monitoring_processes"}}<!doctype html><html lang="en" data-bs-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<script src="/assets/js/theme.js"></script>
</head><body class="wcp-body">
{{template "wcp_open" .}}
<h1>Processes</h1>
<p><a href="/monitoring">← Back</a> · <a href="/monitoring/live">Live</a> · <a href="?show=suspicious"{{if eq .Show "suspicious"}} class="active"{{end}}>Suspicious</a></p>
{{if .AgentError}}<p class="error">{{.AgentError}}</p>{{end}}
{{if .Snap}}<pre class="text-muted">{{.Snap}}</pre>{{end}}
<h2>Signal by user</h2>
<form method="post" action="/monitoring/processes/kill-user">
<input type="hidden" name="_token" value="{{.CSRF}}">
<label>User <input name="user" required></label>
<select name="signal"><option value="TERM">TERM (ask)</option><option value="KILL">KILL</option></select>
<button type="submit">Signal all</button>
</form>
{{template "wcp_close" .}}</body></html>{{end}}
