{{define "users_plan"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-app">
<header class="topbar"><span class="brand">WhaCP</span><span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form"><input type="hidden" name="_token" value="{{.CSRF}}"><button type="submit">Sign out</button></form>
</header>
<main class="container">
  <h1>{{.Title}}</h1>
  {{if .Success}}<p class="alert alert-success">{{.Success}}</p>{{end}}
  {{if .Error}}<p class="alert alert-danger">{{.Error}}</p>{{end}}
  <p class="text-muted">Current plan: {{if .Target.PlanID.Valid}}assigned{{else}}<em>none (unlimited)</em>{{end}}.</p>
  <form method="post" action="/users/{{.Target.ID}}/plan" novalidate>
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <div class="mb-3">
      <label class="form-label" for="p-plan">New plan</label>
      <select class="form-select" id="p-plan" name="plan_id">
        <option value="">No plan (unlimited)</option>
        {{range .Plans}}<option value="{{.ID}}"{{if and $.Target.PlanID.Valid (eq $.Target.PlanID.Int64 .ID)}} selected{{end}}>{{.Name}}</option>{{end}}
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Assign plan</button>
    <a class="btn btn-link" href="/users">Cancel</a>
  </form>
</main>
</body>
</html>{{end}}
