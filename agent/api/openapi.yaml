openapi: 3.1.0
info:
  title: WhaCP Agent API
  version: 0.5.0
  summary: Local, authenticated API of the privileged WhaCP agent.
  description: |
    The agent listens on a Unix socket (default `/run/whacp/agent.sock`,
    mode 0660, group `whacp`). Every request must carry the shared bearer
    token from `/etc/whacp/agent.token`, and the connecting process must be
    root or the panel user (checked with SO_PEERCRED).

    The agent exposes **named actions only**. There is no endpoint that runs
    commands or reads arbitrary files. Actions that modify the server
    (`mutating: true` in `x-whacp-actions`) are refused with
    `write_disabled` unless `allow_write_actions` is enabled. Long-running
    actions return `{job_id}`; follow them with `jobs.get` and `jobs.log`.

    With `listen_tcp` set, the same API is served over TLS 1.3 to the
    addresses in `allowed_clients`; clients pin the certificate's public key
    (`whacp-agent -pin`).

    All responses use the same envelope. Error messages are safe to show to
    users; internal details are written to the agent log only.
  license:
    name: MIT
servers:
  - url: http://agent
    description: Unix socket (use curl --unix-socket /run/whacp/agent.sock)
security:
  - bearer: []
paths:
  /v1/health:
    get:
      summary: Liveness check
      operationId: health
      responses:
        '200':
          description: Agent is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          version: { type: string }
                          uptime_seconds: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/actions/{action}:
    post:
      summary: Execute a named action
      operationId: executeAction
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
            enum:
              # BEGIN generated enum (do not edit; see internal/modules/openapi_test.go)
              - adopt.preview
              - adopt.run
              - adopt.undo
              - agent.actions
              - agent.status
              - apps.install
              - backup.create
              - backup.delete
              - backup.download
              - backup.inspect
              - backup.key_info
              - backup.list
              - backup.remote_test
              - backup.restore
              - backup.server
              - backup.server_restore
              - cron.apply
              - cron.run
              - db.create
              - db.drop
              - db.dump
              - db.grant
              - db.import
              - db.overview
              - db.user_create
              - db.user_drop
              - db.user_password
              - deploy.key
              - deploy.run
              - discovery.certificates
              - discovery.cron
              - discovery.databases
              - discovery.firewall
              - discovery.inventory
              - discovery.nginx
              - discovery.php
              - discovery.redis
              - discovery.users
              - discovery.websites
              - fail2ban.configure
              - fail2ban.status
              - fail2ban.unban
              - files.chmod
              - files.compress
              - files.copy
              - files.delete
              - files.download
              - files.extract
              - files.list
              - files.mkdir
              - files.read
              - files.rename
              - files.search
              - files.upload
              - files.write
              - firewall.rule_add
              - firewall.rule_delete
              - firewall.set_enabled
              - firewall.status
              - jobs.get
              - jobs.list
              - jobs.log
              - logs.download
              - logs.sources
              - logs.tail
              - memcached.configure
              - memcached.flush
              - memcached.status
              - packages.install
              - packages.list
              - packages.refresh
              - packages.updates
              - packages.upgrade
              - php.available
              - php.install
              - php.modules
              - php.set_enabled
              - redis.acl_del
              - redis.acl_set
              - redis.configure
              - redis.flush
              - redis.info
              - redis.key_delete
              - redis.key_edit
              - redis.key_get
              - redis.keys
              - redis.password
              - security.audit
              - security.confirm
              - security.pending
              - security.undo
              - server.reboot
              - server.reboot_cancel
              - server.set_hostname
              - server.set_timezone
              - server.settings
              - server.timezones
              - services.control
              - services.status
              - sites.apply
              - sites.delete
              - sites.inspect
              - sites.list
              - sites.usage
              - ssh.configure
              - ssh.status
              - ssl.custom
              - ssl.delete
              - ssl.inspect
              - ssl.issue
              - ssl.renew
              - ssl.renewal_status
              - system.info
              - system.metrics
              - system.metrics_history
              - workers.apply
              - workers.remove
              - workers.restart
              - workers.status
              # END generated enum
      requestBody:
        required: false
        description: Action parameters. Unknown fields are rejected. Actions without parameters accept `{}` or an empty body.
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Action succeeded; `data` holds the action result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Modifying action refused (`write_disabled`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: Unknown action (`unknown_action`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '405':
          description: Only POST is allowed.
        '422':
          description: Invalid parameters or body (`invalid_params`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: Internal failure (`internal_error`); see the agent log for the request ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '504':
          description: Action exceeded `action_timeout` (`timeout`).
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing/invalid token or disallowed local user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
  schemas:
    Envelope:
      type: object
      required: [success, action, message, request_id]
      properties:
        success: { type: boolean }
        action: { type: string, examples: [discovery.websites] }
        message: { type: string, examples: [OK] }
        data:
          description: Action-specific result (present on success).
        error: { $ref: '#/components/schemas/Error' }
        request_id: { type: string, description: Correlates with the agent log. }
        duration_ms: { type: number }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, unknown_action, write_disabled, invalid_params, internal_error, timeout, method_not_allowed, not_found]
        message: { type: string }
    Website:
      type: object
      description: One website correlated from Nginx server blocks, PHP-FPM pools and certificates (discovery.websites).
      properties:
        id: { type: string, description: Stable identifier derived from the primary domain and enabled state. }
        domain: { type: string }
        aliases: { type: array, items: { type: string } }
        enabled: { type: boolean, description: Present in the active Nginx configuration. }
        kind: { type: string, enum: [php, proxy, static, redirect, other] }
        document_root: { type: string }
        document_root_exists: { type: boolean }
        php:
          type: [object, 'null']
          properties:
            version: { type: string }
            pool: { type: string }
            listen: { type: string }
            user: { type: string }
            resolved: { type: boolean, description: True when a PHP-FPM pool listens on the FastCGI address. }
        ssl:
          type: [object, 'null']
          properties:
            cert_file: { type: string }
            issuer: { type: string }
            not_after: { type: string, format: date-time }
            days_remaining: { type: integer }
            status: { type: string, enum: [valid, expiring, expired, error] }
            lets_encrypt: { type: boolean }
            covers_domain: { type: boolean }
        https: { type: boolean }
        https_redirect: { type: boolean }
        proxy_pass: { type: string }
        listen: { type: array, items: { type: string } }
        config_files: { type: array, items: { type: string } }
        access_logs: { type: array, items: { type: string } }
        error_logs: { type: array, items: { type: string } }
        managed_by: { type: string, description: 'Heuristic hint (aaPanel, FASTPANEL, HestiaCP, CyberPanel, WhaCP).' }
