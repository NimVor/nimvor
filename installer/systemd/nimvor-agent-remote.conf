# Remote access for nimvor-agent.service (installed as
# /etc/systemd/system/nimvor-agent.service.d/20-remote.conf by
# "install.sh --remote-access=..."). The agent then also listens on TLS for
# a NimVor panel on another server (see listen_tcp / allowed_clients in
# /etc/nimvor/agent.json).
[Service]
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
