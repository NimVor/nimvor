{{define "monitoring_trace"}}<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace · WhaCP</title>
<link rel="stylesheet" href="/assets/css/whacp.css">
</head><body class="whacp-app">
