{{define "server_health"}}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server health · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<script src="/assets/js/theme.js"></script>
</head>
<body class="wcp-body">
{{template "wcp_open" .}}
  <h1>Server health</h1>
  <p class="text-muted">Checked at {{.CheckedAt}} UTC.</p>
  {{if .AgentError}}<p class="alert alert-warning">Agent unavailable: {{.AgentError}}</p>{{end}}
  <div class="card">
    <div class="card-body font-monospace small"><pre>{{.Result}}</pre></div>
  </div>
{{template "wcp_close" .}}
</body>
</html>{{end}}
