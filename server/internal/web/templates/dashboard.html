{{define "dashboard"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · WhaCP</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <h1>Signed in</h1>
  <p>Role: {{.User.RoleLabel}} ({{.User.RoleScope}})</p>
  <p class="text-muted">This is the Go panel's authenticated shell. Feature
  pages are being ported from the PHP panel; see the migration status.</p>
</main>
</body>
</html>{{end}}
