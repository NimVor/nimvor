# NimVor website: Nginx + PHP-FPM. Adjust server_name, the paths and the PHP socket.
# TLS is not shown: issue a certificate (for example with certbot) and add the usual
# listen 443 ssl; lines. The site sends its own security headers and CSP, so do not
# add a Content-Security-Policy here.
server {
    listen 80;
    server_name nimvor.com www.nimvor.com;
    root /var/www/nimvor-site/public;
    index index.php;

    # Only index.php runs PHP; everything that is not a real file goes to it.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Assets carry a content hash in the query string, so they can be cached for long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Never serve anything else from the site's folder.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    client_max_body_size 64k;
}
