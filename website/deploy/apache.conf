# NimVor website on Apache 2.4 (mod_rewrite, and PHP through mod_php or PHP-FPM).
# Point DocumentRoot at the public/ folder. If your host only lets you use the site's own
# folder as the web root, the .htaccess in that folder routes everything into public/ and
# keeps config/, storage/, app/ and the other private folders from being served.
<VirtualHost *:80>
    ServerName nimvor.com
    ServerAlias www.nimvor.com
    DocumentRoot /var/www/nimvor-site/public
    DirectoryIndex index.php

    <Directory /var/www/nimvor-site/public>
        # .htaccess here sends every non-file request to index.php.
        # If your host disallows .htaccess, copy its rules below instead.
        AllowOverride All
        Require all granted
    </Directory>

    # With PHP-FPM instead of mod_php:
    # <FilesMatch "\.php$">
    #     SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    # </FilesMatch>
</VirtualHost>
