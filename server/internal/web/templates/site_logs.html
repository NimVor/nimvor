{{define "site_logs"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs · {{.Site.Domain}} · WhaCP</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <p><a href="/sites/{{.Site.ID}}">&larr; {{.Site.Domain}}</a></p>
  <h1>Logs</h1>
  {{with .AgentError}}
  <p class="alert alert-error"><strong>The server could not list the logs:</strong> {{.Message}}{{if .Details}} <span class="text-muted">({{.Details}})</span>{{end}}</p>
  {{end}}
  <!-- The DOM and data attributes drive the reused /assets/js/logs.js. -->
  <div id="wcp-logs" data-tail="/logs/tail" data-download="/logs/download">
    <div class="log-toolbar">
      <select data-log-source aria-label="Log">
        {{if not .Groups}}<option value="">No logs yet</option>{{end}}
        {{range .Groups}}
        <optgroup label="{{.Name}}">
          {{range .Items}}
          <option value="{{.ID}}"{{if eq .ID $.InitialSource}} selected{{end}}>{{.Label}}{{.SizeText}}</option>
          {{end}}
        </optgroup>
        {{end}}
      </select>
      <select data-log-lines aria-label="Lines">
        <option value="100">last 100 lines</option>
        <option value="200" selected>last 200 lines</option>
        <option value="500">last 500 lines</option>
        <option value="1000">last 1000 lines</option>
        <option value="5000">last 5000 lines</option>
      </select>
      <input type="search" placeholder="Filter" data-log-filter aria-label="Filter">
      <label class="checkbox"><input type="checkbox" data-log-live> Live</label>
      <button type="button" data-log-refresh>Refresh</button>
      <a href="#" data-log-download>Download</a>
    </div>
    <pre data-log-output aria-live="polite"></pre>
    <div class="small text-muted" data-log-status></div>
  </div>
  <script src="/assets/js/whacp.js"></script>
  <script src="/assets/js/logs.js" defer></script>
</main>
</body>
</html>{{end}}
