name: CI

on:
  push:
  pull_request:
  workflow_call: # the release workflow runs the whole suite first

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: test -z "$(gofmt -l agent)" || (gofmt -l agent; exit 1)
      - name: vet
        run: cd agent && go vet ./...
      - name: test
        run: cd agent && go test -race ./...
      - name: build
        run: make build

  panel:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
      - run: cd panel && composer install --no-interaction --no-progress
      - run: make lint
      - run: cd panel && vendor/bin/phpunit

  # Agent tests against real services on a disposable runner: nginx,
  # PHP-FPM, MariaDB, Redis, UFW, SSH, Fail2ban, WordPress and Laravel
  # (downloaded from wordpress.org / Packagist as in production).
  realhost:
    runs-on: ubuntu-24.04
    needs: [agent]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install services
        run: |
          sudo systemctl stop mysql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -q 'mysql-server*' 'mysql-client*' 'mysql-common' || true
          sudo rm -rf /var/lib/mysql /etc/mysql
          sudo apt-get update -q
          echo "postfix postfix/main_mailer_type select Internet Site" | sudo debconf-set-selections
          echo "postfix postfix/mailname string ci.whacp.test" | sudo debconf-set-selections
          echo "roundcube-core roundcube/dbconfig-install boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            nginx mariadb-server mariadb-client redis-server memcached pure-ftpd bind9 bind9utils postfix dovecot-imapd dovecot-lmtpd dovecot-sieve opendkim rspamd ufw fail2ban openssh-server git \
            roundcube-core roundcube-sqlite3 roundcube-plugins php-fpm \
            php8.3-cli php8.3-fpm php8.3-mysql php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-intl
          command -v composer || { curl -fsSL https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer; }
          sudo systemctl start mariadb redis-server memcached nginx php8.3-fpm ssh named
          sudo ufw allow 22/tcp
          sudo ufw --force enable
          sudo systemctl restart fail2ban
          sudo nginx -t
          sudo mysql -e 'select version()'
      - name: Real-host tests (as root)
        run: |
          cd agent
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" "HOME=$HOME" WHACP_NETWORK=1 \
            go test -tags realhost -run RealHost -count=1 -p 1 -v ./... 2>&1 | tee realhost.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q -- '--- SKIP' realhost.log || { grep -- '--- SKIP' -A1 realhost.log; exit 1; }
      - name: Installer and post-install end-to-end (Ubuntu)
        run: |
          (cd panel && composer install --no-dev --no-interaction --no-progress --optimize-autoloader)
          mkdir -p dist && (cd agent && CGO_ENABLED=0 go build -trimpath -o ../dist/whacp-agent ./cmd/whacp-agent)
          sudo installer/install.sh --yes --enable-writes --admin-user=admin --admin-email=admin@whacp.test
          sudo tests/integration/postinstall.sh
      - name: Agent sandbox diagnostics (Ubuntu)
        if: failure()
        run: |
          systemctl --version | head -1; uname -r
          sudo journalctl -u whacp-agent --no-pager -n 15 -o cat | grep -i 'fail\|error' || true
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" HOME=$HOME tests/integration/sandbox-probe.sh

  # The same real-host tests on AlmaLinux 9 in a KVM virtual machine (SELinux
  # enforcing, firewalld, Remi's PHP), then the installer.
  realhost-alma:
    runs-on: ubuntu-24.04
    needs: [agent, panel]
    timeout-minutes: 60
    env:
      VM_WORK: ${{ github.workspace }}/.vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring, sodium
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Boot AlmaLinux 9
        run: tests/rhel/vm.sh boot 9
      - name: Build agent, test binaries and panel dependencies
        run: |
          (cd panel && composer install --no-dev --no-interaction --no-progress --optimize-autoloader)
          mkdir -p dist
          (cd agent && CGO_ENABLED=0 go build -trimpath -o ../dist/whacp-agent ./cmd/whacp-agent)
          cd agent
          for d in $(grep -rl 'go:build realhost' internal | xargs -n1 dirname | sort -u); do
            CGO_ENABLED=0 go test -c -tags realhost -o "$d/realhost.test" "./$d"
          done
          cd .. && tar --exclude=.git --exclude=.vm -czf /tmp/whacp.tgz .
      - name: Install services in the VM
        run: |
          tests/rhel/vm.sh put /tmp/whacp.tgz /root/whacp.tgz
          tests/rhel/vm.sh ssh 'mkdir -p /root/whacp && tar -xzf /root/whacp.tgz -C /root/whacp'
          tests/rhel/vm.sh ssh 'bash /root/whacp/tests/rhel/setup.sh'
      - name: Real-host tests (AlmaLinux)
        run: |
          tests/rhel/vm.sh ssh 'cd /root/whacp/agent && for t in $(find internal -name realhost.test | sort); do
              echo "=== $t"; (cd "$(dirname "$t")" && CI=1 WHACP_NETWORK=1 timeout 900 ./realhost.test -test.run RealHost -test.count=1 -test.v)
            done > /root/realhost.log 2>&1; cat /root/realhost.log'
          tests/rhel/vm.sh ssh '! grep -E -e "--- (SKIP|FAIL)" -e "^(FAIL|panic)" /root/realhost.log'
      - name: Installer (AlmaLinux)
        if: always()
        run: |
          tests/rhel/vm.sh ssh 'cd /root/whacp && installer/install.sh --install-deps --yes --enable-writes --admin-user=admin --admin-email=admin@whacp.test'
          tests/rhel/vm.sh ssh 'curl -fsS http://127.0.0.1:8090/healthz && runuser -u whacp -- env WHACP_CONFIG=/etc/whacp/panel.php php /opt/whacp/panel/bin/whacp agent:check'
          tests/rhel/vm.sh ssh 'cd /root/whacp && tests/integration/postinstall.sh'
      - name: SELinux denials and service logs
        if: always()
        run: |
          tests/rhel/vm.sh ssh 'getenforce; systemctl is-active auditd; grep -c denied /var/log/audit/audit.log; grep denied /var/log/audit/audit.log | grep -v "noatsecure\|rlimitinh\|siginh" | tail -80 || true'
          for u in postfix whacp-opendkim named dovecot; do tests/rhel/vm.sh ssh "echo '--- $u'; journalctl --no-pager -o cat -n 25 -u $u | grep -iv 'connect from\|disconnect from' || true"; done

  # Browser tests (Playwright/Chromium) against a write-mode dev instance.
  e2e:
    runs-on: ubuntu-24.04
    needs: [agent, panel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring, sodium
      - run: cd panel && composer install --no-interaction --no-progress
      - name: Install Playwright and Redis
        run: |
          sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends redis-server
          cd tests/e2e
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: NODE_PATH=$PWD/tests/e2e/node_modules E2E_OUT=$RUNNER_TEMP/e2e tests/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e

  smoke:
    runs-on: ubuntu-24.04
    needs: [agent, panel]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test installs the previous version from history
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
      - run: cd panel && composer install --no-interaction --no-progress
      - run: tests/integration/smoke.sh
      - run: tests/integration/upgrade.sh
      - name: Upgrade from the previous release (real code and data)
        run: UPGRADE_FROM="$(git rev-list -1 HEAD -- VERSION)^" tests/integration/upgrade.sh
