{{define "roles_index"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · WhaCP</title>
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}"><button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <h1>Roles</h1>
  <p><a href="/roles/new">New role</a></p>
  <table class="data-table"><thead><tr><th>Name</th><th>Label</th><th>Scope</th><th>2FA</th><th>Users</th><th></th></tr></thead><tbody>
  {{range .Roles}}<tr>
    <td>{{.Name}}</td><td>{{.Label}}</td><td>{{.Scope}}</td>
    <td>{{if .RequireTwoFactor}}required{{else}}—{{end}}</td>
    <td>{{.UserCount}}</td>
    <td><a href="/roles/{{.ID}}/edit">Edit</a>{{if not .IsSystem}} · <form method="post" action="/roles/{{.ID}}/delete" class="inline"><input type="hidden" name="_token" value="{{$.CSRF}}"><button type="submit">Delete</button></form>{{end}}</td>
  </tr>{{end}}
  </tbody></table>
</main>
</body>
</html>{{end}}
