{{define "auth_confirm_password"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your password · WhaCP</title>
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-login">
<main class="login-card">
  <h1>Confirm your password</h1>
  <p class="muted">For your safety, please re-enter your password before making this change.</p>
  {{if .Error}}<p class="alert alert-danger">{{.Error}}</p>{{end}}
  {{if .Success}}<p class="alert alert-success">{{.Success}}</p>{{end}}
  <form method="post" action="/confirm-password" autocomplete="off">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <input type="hidden" name="return" value="{{.Return}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Confirm</button>
  </form>
  <p class="muted small"><a href="/">Back to dashboard</a></p>
</main>
</body>
</html>{{end}}
