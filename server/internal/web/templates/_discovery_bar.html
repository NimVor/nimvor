{{define "discovery_bar"}}
<div class="wcp-discovery-bar">
  <span><i class="bi bi-binoculars me-1"></i>Discovered {{.DiscoveredAgo}}
    <span class="text-body-secondary">({{stamp .DiscoveredAt}} UTC)</span>
    · read-only snapshot, nothing on the server was changed.</span>
  {{if .CanRescan}}
  <form method="post" action="/discovery/run" class="d-inline" data-wcp-busy>
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <input type="hidden" name="return_to" value="{{.Path}}">
    <button class="btn btn-sm btn-outline-primary" type="submit">
      <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
      <i class="bi bi-arrow-repeat"></i> Re-scan
    </button>
  </form>
  {{end}}
</div>
{{end}}
