openapi: 3.1.0
info:
  title: NimVor panel API
  version: "1"
  description: |
    REST API of the NimVor panel. Authenticate with a personal token created
    on your profile page: `Authorization: Bearer nimvor_…`. A token acts with
    its user's permissions and ownership scope (hosting customers only see
    their own websites). Read-only tokens may only use GET. Limit: 120
    requests per minute per token. Select a server with `X-NimVor-Server: <id>`
    (default: this server).

    Long operations return `202` with a `job_id`; poll `GET /jobs/{id}`.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Server:
      name: X-NimVor-Server
      in: header
      required: false
      schema: { type: integer }
  schemas:
    Error:
      type: object
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [unauthorized, forbidden, read_only_token, rate_limited, not_found, validation_failed, rejected, agent_unavailable] }
            message: { type: string }
            reason: { type: string }
            action: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    Website:
      type: object
      properties:
        id: { type: integer }
        domain: { type: string }
        aliases: { type: array, items: { type: string } }
        kind: { type: string, enum: [php, static, proxy] }
        php_version: { type: string }
        document_root: { type: string }
        system_user: { type: string }
        https: { type: boolean }
        enabled: { type: boolean }
        status: { type: string }
        owner_id: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
    Job:
      type: object
      properties:
        job_id: { type: string, pattern: "^[a-f0-9]{16}$" }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /me:
    get:
      summary: The token's user and the selected server
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
  /server:
    get:
      summary: System information and current metrics (server.view)
      parameters: [{ $ref: "#/components/parameters/Server" }]
      responses:
        "200": { description: OK }
        "502": { $ref: "#/components/responses/Error" }
  /websites:
    get:
      summary: Websites visible to the token (websites.view)
      parameters: [{ $ref: "#/components/parameters/Server" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Website" } }
    post:
      summary: Create a website (websites.manage)
      description: Validated, applied with nginx -t / php-fpm -t and rolled back on failure, like the web UI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, examples: [shop.example.com] }
                aliases: { type: array, items: { type: string } }
                kind: { type: string, enum: [php, static, proxy], default: php }
                php_version: { type: string, examples: ["8.3"] }
                proxy_pass: { type: string, examples: ["http://127.0.0.1:3000"] }
      responses:
        "201": { description: Created }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /websites/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: One website
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a website (files are kept unless remove_files=1)
      parameters:
        - { name: remove_files, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: remove_user, in: query, schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200": { description: Deleted }
  /websites/{id}/enable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { summary: Enable a website, responses: { "200": { description: OK } } }
  /websites/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { summary: Disable a website, responses: { "200": { description: OK } } }
  /websites/{id}/ssl:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Issue a Let's Encrypt certificate and enable HTTPS (ssl.manage)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                include_aliases: { type: boolean, default: true }
                staging: { type: boolean, default: false }
      responses:
        "200": { description: HTTPS enabled }
        "502": { $ref: "#/components/responses/Error" }
  /websites/{id}/backups:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { summary: Backups of a website (backups.view), responses: { "200": { description: OK } } }
    post:
      summary: Start a backup (backups.manage)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files: { type: boolean, default: true }
                databases: { type: boolean, default: true }
                encrypt: { type: boolean, default: true }
                label: { type: string }
      responses:
        "202":
          description: Started
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
  /websites/{id}/deploy:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Deploy the connected Git repository (deploy.manage)
      responses:
        "202":
          description: Started
          content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
  /databases:
    get: { summary: Databases (databases.view), responses: { "200": { description: OK } } }
    post:
      summary: Create a database, optionally with a user (databases.manage)
      description: When a user is created the generated password is returned once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                website_id: { type: integer }
                create_user: { type: boolean }
                username: { type: string }
      responses:
        "201": { description: Created }
        "422": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      summary: Notifications (job results, alerts) the token's user may see, newest first
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["1"] }, description: Only unread ones }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200": { description: OK }
  /notifications/read:
    post:
      summary: Mark notifications read (read/write token)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer } }
                all: { type: boolean }
      responses:
        "200": { description: OK }
  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: offset, in: query, schema: { type: integer, default: 0 } }
    get:
      summary: Status and log of a background job started by the token's user
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
