# NimVor write mode for whacp-agent.service.
# Installed as /etc/systemd/system/whacp-agent.service.d/10-write-mode.conf
# by "install.sh --enable-writes" (remove it and set allow_write_actions to
# false in /etc/whacp/agent.json to return to read-only mode).
#
# Write actions install packages, create users, manage services and the
# firewall, so the read-only filesystem sandbox is lifted. Safety then rests
# on the agent itself: a fixed action catalogue, strict input validation,
# a write allowlist limited to NimVor-owned files, validate-before-reload
# with automatic rollback, and a full audit trail.
[Service]
ProtectSystem=no
ProtectHome=no
ProtectKernelTunables=no
# ufw/nftables may load netfilter modules; package scripts may need /dev.
ProtectKernelModules=no
PrivateDevices=no
RestrictSUIDSGID=no
MemoryDenyWriteExecute=no
SystemCallFilter=
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_FSETID CAP_KILL CAP_SETGID CAP_SETUID CAP_SETPCAP CAP_SETFCAP CAP_MKNOD CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_AUDIT_WRITE CAP_SYS_RESOURCE CAP_SYS_CHROOT CAP_LINUX_IMMUTABLE
MemoryMax=1G
TasksMax=512
