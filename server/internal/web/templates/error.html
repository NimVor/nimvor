{{define "error"}}{{template "auth_open" .Title}}
  <div class="card wcp-error-card">
    <div class="card-body">
      {{if .Status}}<div class="wcp-error-code">{{.Status}}</div>{{end}}
      <h2 class="h5">{{.Title}}</h2>
      <p class="mb-2">{{.Message}}</p>
      <a class="btn btn-outline-primary btn-sm mt-3" href="/"><i class="bi bi-house me-1"></i>Back to dashboard</a>
    </div>
  </div>
{{template "auth_close"}}{{end}}
