name: Release

# Push a tag vX.Y.Z matching the VERSION file to publish a release with
# prebuilt archives, SHA256SUMS and signed build provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Release gate: every test suite (unit, HTTP, security, real-service on
  # Ubuntu and AlmaLinux, installer, upgrade, browser) must pass first.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring, sodium
          tools: composer
      - name: Tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build archives
        run: scripts/release.sh
      - name: Installer test on the built archive
        run: |
          mkdir -p /tmp/rel && tar -xzf dist/release/nimvor-$(cat VERSION)-linux-amd64.tar.gz -C /tmp/rel
          /tmp/rel/nimvor-$(cat VERSION)/dist/nimvor-agent -version
          test -f /tmp/rel/nimvor-$(cat VERSION)/panel/vendor/autoload.php
          sudo bash /tmp/rel/nimvor-$(cat VERSION)/installer/install.sh --dry-run --yes --profile=none --admin-user=admin --admin-email=admin@example.com
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/nimvor-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft first, attach the files, then publish. A published release can be immutable
          # (its tag and files can no longer change), so the files must be there before it is public.
          pre=()
          [[ $(cat VERSION) == *-* ]] && pre=(--prerelease) # e.g. 1.0.0-rc1
          gh release create "$GITHUB_REF_NAME" --draft --title "NimVor $(cat VERSION)" --generate-notes --verify-tag "${pre[@]}"
          gh release upload "$GITHUB_REF_NAME" dist/release/nimvor-*.tar.gz dist/release/SHA256SUMS
          [[ $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length') -ge 2 ]] || { echo "the release files did not upload" >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false
