{{define "files_editor"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{.CSRF}}">
<title>Edit {{.Path}} · {{.Site.Domain}} · WhaCP</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <p><a class="btn btn-sm btn-outline-secondary" href="{{.Back}}" data-fe-close>&larr; File manager</a></p>
  <h1><span class="font-monospace">{{.Site.Domain}}/{{.Path}}</span></h1>
  <p class="actions">
    <span class="small text-body-secondary d-none d-md-inline" data-fe-info></span>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-fe-reload>Reload</button>
    <button type="button" class="btn btn-sm btn-primary" data-fe-save disabled>Save</button>
    <button type="button" class="btn btn-sm btn-outline-primary" data-fe-saveclose disabled>Save &amp; close</button>
  </p>
  <!-- The DOM and data attributes drive the reused /assets/js/fileeditor.js;
       saves are refused by the agent when the file changed since it was
       opened (optimistic concurrency). -->
  <div class="wcp-fe" id="wcp-fe"
       data-api="/sites/{{.Site.ID}}/files/api"
       data-path="{{.Path}}" data-back="{{.Back}}"
       data-download="/sites/{{.Site.ID}}/files/download?path={{.Path}}">
    <div class="wcp-fe-body">
      <pre class="wcp-fe-gutter" aria-hidden="true" data-fe-gutter>1</pre>
      <textarea class="wcp-fe-text" spellcheck="false" wrap="off" data-fe-text aria-label="File content" disabled>Loading…</textarea>
    </div>
    <footer class="wcp-fe-status small">
      <span data-fe-pos>Ln 1, Col 1</span>
      <span data-fe-state class="ms-3"></span>
      <label class="form-check form-switch ms-auto mb-0"><input class="form-check-input" type="checkbox" data-fe-wrap> <span class="form-check-label">Wrap lines</span></label>
      <span class="ms-3 text-body-secondary">Ctrl+S saves · Tab inserts a tab</span>
    </footer>
  </div>
  <script src="/assets/js/whacp.js"></script>
  <script src="/assets/js/fileeditor.js" defer></script>
</main>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>{{end}}
