{{define "reset"}}{{template "auth_open" "Choose a new password"}}
  <div class="card wcp-auth-card">
    <div class="card-body p-4">
      <h1 class="h5 mb-3">Choose a new password</h1>
      {{if .Error}}<div class="alert alert-danger" role="alert">{{.Error}}</div>{{end}}
      {{if .Valid}}
      <form method="post" action="/password/reset/{{.Token}}" data-wcp-busy novalidate>
        <input type="hidden" name="_token" value="{{.CSRF}}">
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required autofocus>
          <div class="form-text">At least 12 characters.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password_confirmation">Confirm new password</label>
          <input class="form-control" id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit"><span class="spinner-border spinner-border-sm d-none me-1" aria-hidden="true"></span>Change password</button>
      </form>
      {{else}}
      <p class="small">This link has expired or was already used.</p>
      <a class="btn btn-outline-primary w-100" href="/password/forgot">Ask for a new link</a>
      {{end}}
    </div>
  </div>
{{template "auth_close"}}{{end}}
