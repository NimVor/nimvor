{{define "reset"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password · WhaCP</title>
<link rel="stylesheet" href="/assets/css/whacp.css">
</head>
<body class="whacp-login">
<main class="login-wrap">
  <h1>WhaCP</h1>
  {{if .Error}}<p class="alert alert-danger" role="alert">{{.Error}}</p>{{end}}
  {{if .Valid}}
  <p class="muted">At least 12 characters.</p>
  <form method="post" action="/password/reset/{{.Token}}" autocomplete="off">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required autofocus>
    <label for="password_confirmation">Confirm new password</label>
    <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required>
    <button type="submit">Change password</button>
  </form>
  {{else}}
  <p class="muted">This link has expired or was already used.</p>
  <p><a href="/password/forgot">Ask for a new link</a></p>
  {{end}}
</main>
</body>
</html>{{end}}
