{{define "databases"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databases · WhaCP</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="whacp-app">
<header class="topbar">
  <span class="brand">WhaCP</span>
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}} ({{.User.Username}})</span>
  <form method="post" action="/logout" class="logout-form">
    <input type="hidden" name="_token" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
</header>
<main class="container">
  <h1>Databases</h1>
  {{if .Databases}}
  <table class="data-table">
    <thead><tr><th>Name</th><th>Website</th><th>Created</th></tr></thead>
    <tbody>
    {{range .Databases}}
      <tr>
        <td>{{.Name}}</td>
        <td>{{if .Website.Valid}}{{.Website.String}}{{else}}—{{end}}</td>
        <td>{{.CreatedAt}}</td>
      </tr>
    {{end}}
    </tbody>
  </table>
  {{else}}
  <p class="text-muted">No databases yet.</p>
  {{end}}
</main>
</body>
</html>{{end}}
